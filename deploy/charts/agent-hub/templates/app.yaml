{{- if eq (toString .Values.appRegistration.enabled) "true" }}
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: agenthub
  namespace: app-system
spec:
  data:
    desc: Agent Hub Workspace
    url: {{ include "agent-hub.appUrl" . | quote }}
  icon: {{ printf "%s/brand/agent-hub.svg" (include "agent-hub.appUrl" .) | quote }}
  i18n:
    zh:
      name: Agent Hub
    zh-Hans:
      name: Agent Hub
  menuData:
  name: Agent Hub
  type: iframe
  displayType: normal
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: agenthub-console
  namespace: app-system
spec:
  data:
    desc: Agent Hub Console Window
    url: {{ include "agent-hub.appUrl" . | quote }}
  icon: {{ printf "%s/brand/agenthub-console.svg" (include "agent-hub.appUrl" .) | quote }}
  i18n:
    zh:
      name: Agent Hub 控制台
    zh-Hans:
      name: Agent Hub 控制台
  menuData:
  name: Agent Hub Console
  type: iframe
  displayType: hidden
{{- end }}
